name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check documentation paths
        run: python3 scripts/check_doc_paths.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: berlin-weather-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          docker run --rm \
            --mount type=bind,src="${{ github.workspace }}",dst=/project,readonly \
            --workdir /project \
            berlin-weather-test \
            Rscript -e 'testthat::test_dir("tests/testthat")'

      - name: Check R line coverage
        run: |
          docker run --rm \
            --mount type=bind,src="${{ github.workspace }}",dst=/project,readonly \
            --workdir /project \
            berlin-weather-test \
            Rscript scripts/check_coverage.R
