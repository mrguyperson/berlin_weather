name: Build Weather Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: canonical-weather-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/weather-image:latest
            ghcr.io/${{ github.repository_owner }}/weather-image:sha-${{ github.sha }}
          cache-from: type=gha,scope=weather-image
          cache-to: type=gha,mode=max,scope=weather-image
