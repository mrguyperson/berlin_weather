name: Build Weather Image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "renv.lock"
      - ".Rprofile"
      - "renv/activate.R"
      - "renv/settings.json"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/weather-image:latest \
            -t ghcr.io/${{ github.repository_owner }}/weather-image:sha-${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/weather-image:latest
          docker push ghcr.io/${{ github.repository_owner }}/weather-image:sha-${{ github.sha }}
