name: Update Weather and Publish

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Weather Image"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    # Allows:
    # 1. normal push
    # 2. scheduled runs
    # 3. manual runs
    # 4. "Build Weather Image" completed successfully
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository_owner }}/weather-image:latest
      options: --user root

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Determine cache year
        id: cache-date
        run: |
          echo "year=$(Rscript -e 'cat(lubridate::year(lubridate::today()))')" \
            >> "$GITHUB_OUTPUT"

      - name: Restore targets store
        id: targets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _targets/objects
            _targets/meta/meta
          key: targets-v1-${{ runner.os }}-${{ steps.cache-date.outputs.year }}-${{ hashFiles('_targets.R', 'R/functions.R', 'Dockerfile') }}

      - name: Build targets
        run: Rscript -e 'targets::tar_make(reporter = "verbose")'

      - name: Save targets store
        if: success() && steps.targets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _targets/objects
            _targets/meta/meta
          key: targets-v1-${{ runner.os }}-${{ steps.cache-date.outputs.year }}-${{ hashFiles('_targets.R', 'R/functions.R', 'Dockerfile') }}

      - name: Publish dashboard
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: quarto-pub
          QUARTO_PUB_AUTH_TOKEN: ${{ secrets.QUARTO_PUB_AUTH_TOKEN }}
          
